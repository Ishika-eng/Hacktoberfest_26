name: CI

on:
  push:
  pull_request:

jobs:
  agent:
    name: Agent unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check agent
      - name: Unit tests (model and build are mocked)
        run: python -I -m unittest discover -s agent/tests -t agent -v

  sample-apps:
    name: Sample apps pass on Spring Boot 2.7
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [sample-app, sample-jpa-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Baseline tests
        working-directory: ${{ matrix.app }}
        run: mvn -B test
